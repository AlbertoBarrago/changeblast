version: 2

project_name: serval

before:
  hooks:
    - go mod tidy

builds:
  - id: serval
    main: .
    binary: serval
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
        -X github.com/AlbertoBarrago/serval/cmd.version={{.Version}}
        -X github.com/AlbertoBarrago/serval/cmd.commit={{.ShortCommit}}
        -X github.com/AlbertoBarrago/serval/cmd.date={{.Date}}

archives:
  - id: serval
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - src: docs/*.1
        strip_parent: true

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: serval
    repository:
      owner: AlbertoBarrago
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/AlbertoBarrago/serval"
    description: "Local-first CLI that estimates the blast radius of a code change"
    license: "MIT"
    install: |
      bin.install "serval"
      man1.install Dir["*.1"]
    test: |
      system "#{bin}/serval", "version"
