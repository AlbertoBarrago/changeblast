version: 2

project_name: blast

before:
  hooks:
    - go mod tidy

builds:
  - id: blast
    main: .
    binary: blast
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
        -X github.com/AlbertoBarrago/blast/cmd.version={{.Version}}
        -X github.com/AlbertoBarrago/blast/cmd.commit={{.ShortCommit}}
        -X github.com/AlbertoBarrago/blast/cmd.date={{.Date}}

archives:
  - id: blast
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - src: docs/*.1
        strip_parent: true

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: blast
    repository:
      owner: AlbertoBarrago
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/AlbertoBarrago/blast"
    description: "Local-first CLI that estimates the blast radius of a code change"
    license: "MIT"
    install: |
      bin.install "blast"
      man1.install Dir["*.1"]
    caveats: |
      "blast" is also the name of an unrelated homebrew-core formula
      (NCBI's BLAST bioinformatics tool). Always install/upgrade this
      one by its fully-qualified name:
        brew install AlbertoBarrago/tap/blast
      A bare "brew install blast" resolves to homebrew-core instead.
    test: |
      system "#{bin}/blast", "version"
